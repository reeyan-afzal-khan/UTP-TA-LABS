# How the voice should say things the text writes differently.
#
# Applied, in order, to the narration just before it is sent to the TTS voice.
# Subtitles and the script keep the written form. Each rule is a regular
# expression and its spoken replacement. A course can append its own rules in
# .all_lectures/<course-slug>/pronunciations.yaml.

rules:
  - ['C\+\+', 'C plus plus']
  - ['\bg\+\+', 'G plus plus']
  - ['\bC#', 'C sharp']
  - ['\.cpp\b', ' dot C P P']
  - ['\.ipynb\b', ' notebook']
  - ['\.py\b', ' dot P Y']
  - ['\.csv\b', ' dot C S V']
  - ['\bstd\b', 'standard']
  - ['\b(Week|Lab|Practical|Chapter) I\b', '\1 1']
  - ['\b(Week|Lab|Practical|Chapter) II\b', '\1 2']
  - ['\b(Week|Lab|Practical|Chapter) III\b', '\1 3']
  - ['\b1D\b', 'one-D']
  - ['\b2D\b', 'two-D']
  - ['\b3D\b', 'three-D']
  - ['\bIDs\b', 'I-Ds']
  - ['\bID\b', 'I-D']
  - ['\bvs\.?(?=\s)', 'versus']
  - ['\be\.g\.', 'for example']
  - ['\bi\.e\.', 'that is']
  - ['\betc\.', 'et cetera']
  - ['\bADT\b', 'A-D-T']
  - ['\bNULL\b', 'null']
  - ['\b[Oo][Kk]\b', 'okay']
  - ['\bWSL\b', 'W-S-L']
  - ['\bSQL\b', 'sequel']
  - ['(\w)/(\w)', '\1 or \2']          # read/write -> read or write
  - ['\s+---?\s+', ', ']                # dashes become a short pause
  - ['—|–', ', ']
